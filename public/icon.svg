<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#071739" />
    </linearGradient>

    <!-- Divine Golden Light Gradient -->
    <radialGradient id="divineGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#071739" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Cross Gradient -->
    <linearGradient id="goldCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cross 3D Bevel Highlight -->
    <linearGradient id="crossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bible Pages Gradient -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Gold Trim Gradient -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="crossGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>

    <!-- Glassmorphic Top Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle App Background with Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#divineGlow)" />
  
  <!-- Subtle inner border -->
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />

  <!-- 2. Divine Sunburst / Heavenly Light Beams -->
  <g opacity="0.3" stroke="#fde047" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="180" x2="256" y2="40" stroke-width="3" stroke-dasharray="10 14" />
    <line x1="256" y1="180" x2="160" y2="55" stroke-dasharray="8 12" />
    <line x1="256" y1="180" x2="352" y2="55" stroke-dasharray="8 12" />
    <line x1="256" y1="180" x2="80" y2="110" stroke-dasharray="6 14" />
    <line x1="256" y1="180" x2="432" y2="110" stroke-dasharray="6 14" />
    <line x1="256" y1="180" x2="40" y2="190" stroke-dasharray="4 16" />
    <line x1="256" y1="180" x2="472" y2="190" stroke-dasharray="4 16" />
  </g>

  <!-- 3. Open Holy Bible Base Book -->
  <g filter="url(#softShadow)">
    <!-- Bible Leather Cover Underneath (Deep Burgundy / Wine Brown) -->
    <path d="M 60,365 Q 155,340 256,360 Q 357,340 452,365 L 452,385 Q 357,360 256,380 Q 155,360 60,385 Z" fill="#451a03" />
    
    <!-- Gold Page Gilt Edges -->
    <path d="M 64,355 Q 155,332 256,352 Q 357,332 448,355 L 450,370 Q 357,348 256,368 Q 155,348 62,370 Z" fill="url(#goldTrim)" />

    <!-- Left Book Leaf (Curved 3D open page) -->
    <path d="M 256,348 Q 155,324 72,342 L 72,240 Q 155,220 256,244 Z" fill="url(#pageGradLeft)" />

    <!-- Right Book Leaf (Curved 3D open page) -->
    <path d="M 256,348 Q 357,324 440,342 L 440,240 Q 357,220 256,244 Z" fill="url(#pageGradRight)" />

    <!-- Book Spine Crease & Shadow -->
    <path d="M 254,244 L 254,348 Q 256,350 258,348 L 258,244 Z" fill="#94a3b8" opacity="0.6" />

    <!-- Decorative Scripture Text Line Hints on Pages -->
    <g fill="#94a3b8" opacity="0.45">
      <!-- Left Page lines -->
      <rect x="100" y="258" width="120" height="4" rx="2" />
      <rect x="100" y="272" width="120" height="4" rx="2" />
      <rect x="100" y="286" width="120" height="4" rx="2" />
      <rect x="100" y="300" width="120" height="4" rx="2" />
      <rect x="100" y="314" width="85" height="4" rx="2" />

      <!-- Right Page lines -->
      <rect x="292" y="258" width="120" height="4" rx="2" />
      <rect x="292" y="272" width="120" height="4" rx="2" />
      <rect x="292" y="286" width="120" height="4" rx="2" />
      <rect x="292" y="300" width="120" height="4" rx="2" />
      <rect x="292" y="314" width="75" height="4" rx="2" />
    </g>

    <!-- Crimson Red Silk Ribbon Bookmark -->
    <path d="M 253,244 C 253,300 248,370 240,410 L 256,400 L 272,410 C 264,370 259,300 259,244 Z" fill="#dc2626" />
    <path d="M 253,244 C 253,300 248,370 240,410 L 256,400 Z" fill="#b91c1c" />
  </g>

  <!-- 4. Majestic Golden Cross Rising Above the Bible -->
  <g filter="url(#crossGlow)">
    <!-- Vertical Cross Beam -->
    <rect x="238" y="70" width="36" height="200" rx="8" fill="url(#goldCross)" />
    <!-- Vertical Cross Highlight -->
    <rect x="240" y="72" width="12" height="196" rx="4" fill="url(#crossHighlight)" />

    <!-- Horizontal Cross Beam -->
    <rect x="176" y="118" width="160" height="36" rx="8" fill="url(#goldCross)" />
    <!-- Horizontal Cross Highlight -->
    <rect x="178" y="120" width="156" height="12" rx="4" fill="url(#crossHighlight)" />

    <!-- Center Radiant Diamond Emblem -->
    <polygon points="256,122 270,136 256,150 242,136" fill="#ffffff" opacity="0.95" />
    <circle cx="256" cy="136" r="3.5" fill="#fef08a" />
  </g>

  <!-- 5. Glassmorphic Upper Hemisphere Sheen -->
  <path d="M 16,124 Q 16,16 124,16 L 388,16 Q 496,16 496,124 C 496,200 400,240 256,240 C 112,240 16,200 16,124 Z" fill="url(#glassSheen)" pointer-events="none" />
</svg>
